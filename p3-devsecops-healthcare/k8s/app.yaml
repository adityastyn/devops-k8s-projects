apiVersion: v1
kind: ServiceAccount
metadata:
  name: medisecure
  namespace: healthcare
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medisecure
  namespace: healthcare
  labels: { app: medisecure }
spec:
  replicas: 2
  selector:
    matchLabels: { app: medisecure }
  template:
    metadata:
      labels: { app: medisecure }
    spec:
      serviceAccountName: medisecure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: medisecure
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - { name: APP_VERSION, value: VERSION_PLACEHOLDER }
            - name: API_KEY
              valueFrom:
                secretKeyRef: { name: medisecure-secret, key: API_KEY }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            privileged: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi, ephemeral-storage: 16Mi }
            limits: { cpu: 250m, memory: 128Mi, ephemeral-storage: 32Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: medisecure
  namespace: healthcare
spec:
  type: NodePort
  selector: { app: medisecure }
  ports: [{ port: 80, targetPort: 3000, nodePort: 30090 }]
---
# Default-deny: only allow inbound traffic to the app port, no other ingress or egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: medisecure-restrict
  namespace: healthcare
spec:
  podSelector: { matchLabels: { app: medisecure } }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ protocol: TCP, port: 3000 }]
  egress: []
