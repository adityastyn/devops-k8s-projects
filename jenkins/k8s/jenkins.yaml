apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: jenkins
---
# Jenkins deploys to several namespaces, so it gets cluster-admin in this local lab cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
  labels: { app: jenkins }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: jenkins }
  template:
    metadata:
      labels: { app: jenkins }
    spec:
      serviceAccountName: jenkins
      securityContext:
        runAsUser: 0          # needs the node's Docker socket to build images
      containers:
        - name: jenkins
          image: local/jenkins-devops:1
          imagePullPolicy: Never
          env:
            - name: REPO_URL
              value: REPO_URL_PLACEHOLDER
            - name: HOST_JENKINS_HOME   # same folder as seen by the node's Docker engine
              value: /var/lib/jenkins-home
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /login, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: home, mountPath: /var/jenkins_home }
            - { name: docker-sock, mountPath: /var/run/docker.sock }
      volumes:
        - name: home
          hostPath: { path: /var/lib/jenkins-home, type: DirectoryOrCreate }
        - name: docker-sock
          hostPath: { path: /var/run/docker.sock, type: Socket }
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
spec:
  type: NodePort
  selector: { app: jenkins }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 32000
