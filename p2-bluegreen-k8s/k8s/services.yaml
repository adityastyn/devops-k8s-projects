apiVersion: v1
kind: Namespace
metadata:
  name: bluegreen
---
# LIVE service: customers use this. Jenkins switches its "color" selector between blue and green.
apiVersion: v1
kind: Service
metadata:
  name: brewbox-live
  namespace: bluegreen
spec:
  type: NodePort
  selector: { app: brewbox, color: blue }
  ports: [{ port: 80, targetPort: 3000, nodePort: 30081 }]
---
# PREVIEW service: always points at the idle colour so a new release can be tested before go-live.
apiVersion: v1
kind: Service
metadata:
  name: brewbox-preview
  namespace: bluegreen
spec:
  type: NodePort
  selector: { app: brewbox, color: green }
  ports: [{ port: 80, targetPort: 3000, nodePort: 30082 }]
