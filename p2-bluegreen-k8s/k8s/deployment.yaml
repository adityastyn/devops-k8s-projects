# Template: __COLOR__ is replaced with "blue" or "green" by the Jenkins pipeline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brewbox-__COLOR__
  namespace: bluegreen
  labels: { app: brewbox, color: __COLOR__ }
spec:
  replicas: 2
  selector:
    matchLabels: { app: brewbox, color: __COLOR__ }
  template:
    metadata:
      labels: { app: brewbox, color: __COLOR__ }
    spec:
      containers:
        - name: brewbox
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - { name: DEPLOY_COLOR, value: __COLOR__ }
            - { name: APP_VERSION, value: VERSION_PLACEHOLDER }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
